name: Build CV PDF

# Runs every time cv.tex changes on the main branch (or when started by hand
# from the Actions tab), compiles it with LaTeX and saves cv.pdf in the repo.
on:
  push:
    branches: [main]
    paths:
      - cv.tex
      - .github/workflows/build-cv.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compile cv.tex with pdfLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex

      - name: Save cv.pdf back into the repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Rebuild cv.pdf
          file_pattern: cv.pdf

      - name: Also attach cv.pdf to this run
        uses: actions/upload-artifact@v7
        with:
          name: cv-pdf
          path: cv.pdf

  # Turns cv.pdf into a web page (like zeyu2001/cv) and publishes it on
  # GitHub Pages at https://OWNER.github.io/REPO/
  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get cv.pdf from the build job
        uses: actions/download-artifact@v8
        with:
          name: cv-pdf

      - name: Convert cv.pdf to HTML with pdf2htmlEX
        run: |
          mkdir site
          cp cv.pdf site/cv.pdf
          docker run --rm -v "$PWD:/pdf" -w /pdf \
            pdf2htmlex/pdf2htmlex:0.18.8.rc2-master-20200820-ubuntu-20.04-x86_64 \
            --process-outline 0 --fallback 1 --bg-format svg --zoom 1.3 \
            --process-type3 1 --dest-dir site cv.pdf index.html

      - name: Upload the web page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
